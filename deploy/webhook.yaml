apiVersion: v1
kind: Secret
metadata:
  name: edgecenter-credentials
  namespace: external-dns
type: Opaque
stringData:
  api-key: "${EDGECENTER_API_KEY}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-edgecenter-webhook
  namespace: external-dns
spec:
  selector:
    matchLabels:
      app: external-dns-edgecenter-webhook
  template:
    metadata:
      labels:
        app: external-dns-edgecenter-webhook
    spec:
      containers:
      - name: webhook
        image: external-dns-edgecenter-webhook:latest
        ports:
        - containerPort: 8888
        env:
        - name: EDGECENTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: edgecenter-credentials
              key: api-key
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns-edgecenter-webhook
  namespace: external-dns
spec:
  selector:
    app: external-dns-edgecenter-webhook
  ports:
  - port: 8888
    targetPort: 8888
  type: ClusterIP 